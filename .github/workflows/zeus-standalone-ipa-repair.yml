name: ZEUS standalone unsigned IPA repair
on:
  push:
    branches:
      - build/zeus-unsigned-ipa-repair-20261023
    paths:
      - '.github/workflows/zeus-standalone-ipa-repair.yml'
      - 'ZEUSNext/**'
      - '.zeus-ci/project.py'
      - 'ZEUSNextTests/**'
      - 'ZEUSNextUITests/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zeus-standalone-unsigned-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Prepare standalone ZEUS project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          git rev-parse HEAD > results/zeus-commit.txt
          xcodegen --version || brew install xcodegen
          python3 .zeus-ci/project.py
          xcodegen generate --spec zeus-project.json
      - name: Compile iPhone and iPad application without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ZEUSNext.xcodeproj -scheme ZEUSNext -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ZEUSStandaloneDevice" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' \
            build 2>&1 | tee results/device-build.log
      - name: Validate and package actual unsigned device IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/ZEUSStandaloneDevice/Build/Products/Release-iphoneos/ZEUSNext.app"
          test -s "$app/ZEUSNext"
          test -f "$app/Info.plist"
          test ! -d "$app/_CodeSignature"
          xcrun lipo -verify_arch arm64 "$app/ZEUSNext"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist" | tee results/bundle-identifier.txt
          /usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$app/Info.plist" | tee results/display-name.txt
          mkdir -p results/Payload
          cp -R "$app" results/Payload/
          (cd results && zip -qry ZEUS-standalone-unsigned.ipa Payload)
          unzip -t results/ZEUS-standalone-unsigned.ipa > results/ipa-integrity.txt
          unzip -Z1 results/ZEUS-standalone-unsigned.ipa | grep -Fqx 'Payload/ZEUSNext.app/ZEUSNext'
          unzip -Z1 results/ZEUS-standalone-unsigned.ipa | grep -Fqx 'Payload/ZEUSNext.app/Info.plist'
          shasum -a 256 results/ZEUS-standalone-unsigned.ipa > results/ZEUS-standalone-unsigned.ipa.sha256
          du -h results/ZEUS-standalone-unsigned.ipa
          rm -rf results/Payload
      - name: Publish IPA and verification
        uses: actions/upload-artifact@v4
        with:
          name: zeus-standalone-unsigned-ipa-${{ github.run_id }}
          path: |
            results/ZEUS-standalone-unsigned.ipa
            results/ZEUS-standalone-unsigned.ipa.sha256
            results/ipa-integrity.txt
            results/zeus-commit.txt
            results/bundle-identifier.txt
            results/display-name.txt
          retention-days: 14
          if-no-files-found: error
      - name: Publish build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeus-standalone-build-log-${{ github.run_id }}
          path: results/device-build.log
          retention-days: 14
          if-no-files-found: ignore
