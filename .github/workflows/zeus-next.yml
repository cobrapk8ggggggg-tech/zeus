name: ZEUS stability and interface verification
on:
  push:
    branches: [codex/zeus-browser-next, fix/zeus-next-latest-build-20261020, fix/zeus-browser-stability-20261021]
    paths: [ZEUSNext/**, ZEUSNextTests/**, ZEUSNextUITests/**, .zeus-ci/**, .github/workflows/zeus-next.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zeus-stability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify ${{ matrix.suite }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [core, iphone, ipad]
    env:
      ZEUS_TEST_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Generate lightweight native project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 .zeus-ci/project.py
          xcodegen generate --spec zeus-project.json
          mkdir -p results
      - name: Start deterministic local fixture
        run: |
          python3 .zeus-ci/fixture_server.py > results/fixture.log 2>&1 &
          curl --fail --max-time 10 --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/ > /dev/null
      - name: Run native tests on the selected simulator
        timeout-minutes: 22
        run: |
          set -o pipefail
          device_id=$(python3 - <<'PY'
          import json, os, subprocess
          target = 'iPad' if os.environ['ZEUS_TEST_SUITE'] == 'ipad' else 'iPhone'
          runtimes=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          for runtime, devices in sorted(runtimes.items(), reverse=True):
              if 'iOS-26' in runtime:
                  for device in devices:
                      if target in device['name']:
                          print(device['udid']); raise SystemExit
          raise SystemExit('No matching iOS 26 simulator')
          PY
          )
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          curl --fail --max-time 10 http://127.0.0.1:8765/image.png -o "$RUNNER_TEMP/avatar-fixture.png"
          xcrun simctl addmedia "$device_id" "$RUNNER_TEMP/avatar-fixture.png"
          if [ "$ZEUS_TEST_SUITE" = core ]; then
            target=ZEUSNextTests
          else
            target=ZEUSNextUITests
          fi
          xcodebuild -project ZEUSNext.xcodeproj -scheme ZEUSNext -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -only-testing:"$target" -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 \
            -derivedDataPath "$RUNNER_TEMP/ZEUSSimulator" \
            -resultBundlePath "$GITHUB_WORKSPACE/results/tests.xcresult" \
            test CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | tee results/test.log
      - name: Export results and screenshots
        if: always()
        run: |
          if [ -f results/tests.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path results/tests.xcresult --output-path results/screenshots || true
            xcrun xcresulttool get test-results summary --path results/tests.xcresult > results/summary.json || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeus-review-${{ matrix.suite }}
          path: |
            results/screenshots
            results/summary.json
            results/test.log
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: zeus-diagnostics-${{ matrix.suite }}
          path: results
          retention-days: 7
          if-no-files-found: warn
