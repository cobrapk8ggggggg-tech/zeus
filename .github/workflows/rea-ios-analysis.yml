name: REA iOS macOS analysis

on:
  push:
    branches: [codex/rea-ios-macos-analysis]
    paths: [.rea-ios/**, .github/workflows/rea-ios-analysis.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cobrapk8ggg-netizen/Ios
          ref: 0542beb72680458cac6fcf365c1247324b4b2402
          path: rea-target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Install pinned REA package
        run: npm ci --prefix .rea-ios/runtime --no-audit --no-fund
      - name: Inspect original archive and embedded JavaScript through MCP
        run: |
          python3 .rea-ios/analyze.py source \
            --target 'rea-target/ZEUS Browser.zip' \
            --work "$RUNNER_TEMP/rea-ios" \
            --output results/source
      - name: Generate Xcode project for original Swift sources
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 .rea-ios/build_project.py "$RUNNER_TEMP/rea-ios"
          xcodegen generate --spec "$RUNNER_TEMP/rea-ios/project.json" --project "$RUNNER_TEMP/rea-ios"
          mkdir -p results/build
          cp "$RUNNER_TEMP/rea-ios/project.json" results/build/project.json
          xcodebuild -version > results/build/xcode-version.txt
      - name: Build unsigned iOS application
        run: |
          set -o pipefail
          xcodebuild -project "$RUNNER_TEMP/rea-ios/ZEUSAnalysis.xcodeproj" \
            -scheme ZEUSBrowser -configuration Release \
            -destination 'generic/platform=iOS' -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/rea-ios/DerivedData" \
            -resultBundlePath "$GITHUB_WORKSPACE/results/build/build.xcresult" \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee results/build/build.log
      - name: Inspect compiled Apple artifact through MCP
        run: |
          python3 .rea-ios/analyze.py metadata \
            --target "$RUNNER_TEMP/rea-ios/DerivedData/Build/Products/Release-iphoneos/ZEUSBrowser.app" \
            --output results/apple-artifact
      - name: Package unsigned application and native executable
        if: success() || failure()
        run: |
          app="$RUNNER_TEMP/rea-ios/DerivedData/Build/Products/Release-iphoneos/ZEUSBrowser.app"
          if [ -d "$app" ]; then
            mkdir -p results/build/Payload results/native
            cp -R "$app" results/build/Payload/
            cp "$app/ZEUSBrowser" results/native/ZEUSBrowser
            cp "$app/Info.plist" results/native/Info.plist
            (cd results/build && zip -qry ZEUSBrowser-analysis-unsigned.ipa Payload)
            rm -r results/build/Payload
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-ios-macos-results
          path: results
          retention-days: 7
          if-no-files-found: error

  ghidra:
    needs: macos
    if: always() && needs.macos.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rea-ios-macos-results
          path: macos-results
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned REA and Ghidra
        run: |
          npm ci --prefix .rea-ios/runtime --no-audit --no-fund
          curl --fail --location --retry 3 \
            'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip' \
            --output "$RUNNER_TEMP/ghidra.zip"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/ghidra/ghidra_12.1.4_PUBLIC" >> "$GITHUB_ENV"
      - name: Analyze compiled arm64 Mach-O through REA MCP and Ghidra
        env:
          REA_GHIDRA_STARTUP_TIMEOUT_MS: '900000'
          GHIDRA_HEADLESS_MAXMEM: 4G
        run: |
          python3 .rea-ios/analyze.py deep \
            --target macos-results/native/ZEUSBrowser \
            --output results/ghidra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-ios-ghidra-results
          path: results
          retention-days: 7
          if-no-files-found: warn
