name: ZEUS project service tests
on:
  push:
    branches: [feature/zeus-project-agent-20261023, feature/zeus-direct-integrations-20261023]
    paths: [Runtime/**, .github/workflows/zeus-agent-service-tests.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r Runtime/requirements.txt
      - run: npm install -g @openai/codex@0.163.0
      - run: python -m unittest -v test_service
        working-directory: Runtime
      - name: Build the real worker image
        run: docker build -f Runtime/Dockerfile -t zeus-project-agent:test .
      - name: Verify container identity and persistent volume after restart
        run: python Runtime/test_container.py
