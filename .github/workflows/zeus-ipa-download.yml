name: ZEUS integrated IPA - build and publish (no tests)
run-name: IPA from ${{ github.ref_name }} (${{ github.sha }})
on:
  push:
    branches: [build/zeus-unsigned-ipa-repair-20261023, feature/zeus-project-agent-20261023, feature/zeus-direct-integrations-20261023, feature/zeus-ipad-layout-studio-20261025, feature/zeus-cloud-account-20261026]
    paths: [.github/workflows/zeus-ipa-download.yml, .openminis/**, ZEUSNext/**]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Browser source branch, tag or commit to package
        required: false
        default: feature/zeus-native-agent-harness-20261023
        type: string
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cobrapk8ggggggg-tech/zeus
          ref: ${{ inputs.source_ref || github.sha }}
          path: browser
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenMinis/OpenMinis
          ref: b4c0661d5631ebab4d1a2e6f3fd4c805d4030a6c
          path: upstream
          submodules: recursive
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: upstream/deps/rclone-mobile/go.sum
      - name: Prepare device build and record exact source revisions
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p results
          git -C browser rev-parse HEAD > results/browser-commit.txt
          git -C upstream rev-parse HEAD > results/openminis-commit.txt
          python3 browser/.openminis/prepare_reference.py upstream --sdk iphoneos --manifest results/original-source.json
          brew install ninja llvm lld libarchive pkg-config meson
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - uses: actions/cache/restore@v4
        id: native
        with:
          path: |
            upstream/deps/libs
            upstream/deps/include
            upstream/deps/resources
            upstream/deps/frameworks
            upstream/deps/lame-build
          key: openminis-b4c0661-iphoneos-arm64-xcode263-v2-114-hook-inode
      - name: Build real device dependencies and Linux rootfs
        if: steps.native.outputs.cache-hit != 'true'
        working-directory: upstream
        run: |
          set -euo pipefail
          bash deps/build_lame.sh 2>&1 | tee ../results/lame.log
          bash deps/build_ffmpeg.sh 2>&1 | tee ../results/ffmpeg.log
          bash deps/build_ish.sh 2>&1 | tee ../results/ish.log
          bash deps/prepare_alpine_rootfs.sh 2>&1 | tee ../results/rootfs.log
          bash deps/build_rclone_ios.sh 2>&1 | tee ../results/rclone.log
      - uses: actions/cache/save@v4
        if: steps.native.outputs.cache-hit != 'true'
        with:
          path: |
            upstream/deps/libs
            upstream/deps/include
            upstream/deps/resources
            upstream/deps/frameworks
            upstream/deps/lame-build
          key: openminis-b4c0661-iphoneos-arm64-xcode263-v2-114-hook-inode
      - name: Require full native device dependencies
        run: |
          set -euo pipefail
          test -s upstream/deps/resources/alpine-rootfs.zip
          test -f upstream/deps/include/ish/ish.h
          test -d upstream/deps/frameworks/FFmpeg.framework
      - name: Embed original native OpenMinis source
        run: |
          set -euo pipefail
          python3 browser/.openminis/embed_native.py upstream browser results/native-adapters.json
          gem install xcodeproj --version 1.27.0 --no-document
          ruby browser/.openminis/build_project.rb upstream browser
      - name: Build iOS device application (no simulator tests)
        run: |
          set -euo pipefail
          xcodebuild -project upstream/src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Release -destination 'generic/platform=iOS' -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/ZEUSNativeDevice" \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 \
            2>&1 | tee results/device-build.log
      - name: Package unsigned IPA and verify its contents
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/ZEUSNativeDevice/Build/Products/Release-iphoneos/Minis.app"
          test -s "$app/Minis"
          test -f "$app/Info.plist"
          test ! -d "$app/_CodeSignature"
          test -d "$app/PlugIns"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = tools.rea.ZEUSBrowserAnalysis
          xcrun lipo "$app/Minis" -verify_arch arm64
          python3 browser/.openminis/prune_resources.py "$app" > results/text-edition-resources.json
          python3 browser/.openminis/size_audit.py "$app" results/ipa-size-audit.json --strip
          xcrun lipo "$app/Minis" -verify_arch arm64
          mkdir -p results/Payload
          cp -R "$app" results/Payload/
          (cd results && zip -qry ZEUS-native-unsigned.ipa Payload)
          unzip -t results/ZEUS-native-unsigned.ipa > results/ipa-zip-check.txt
          unzip -Z1 results/ZEUS-native-unsigned.ipa | grep -Fqx 'Payload/Minis.app/Minis'
          unzip -Z1 results/ZEUS-native-unsigned.ipa | grep -Fqx 'Payload/Minis.app/Info.plist'
          shasum -a 256 results/ZEUS-native-unsigned.ipa > results/ZEUS-native-unsigned.ipa.sha256
          rm -rf results/Payload
      - name: Publish IPA immediately after successful package verification
        uses: actions/upload-artifact@v4
        with:
          name: ZEUS-integrated-unsigned-IPA-${{ github.run_id }}
          path: |
            results/*.ipa
            results/*.sha256
            results/*commit.txt
            results/native-adapters.json
            results/ipa-zip-check.txt
            results/ipa-size-audit.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Upload diagnostic logs only after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zeus-native-ipa-build-logs-${{ github.run_id }}
          path: |
            results/*.log
            results/*source.json
          retention-days: 14
          if-no-files-found: ignore
