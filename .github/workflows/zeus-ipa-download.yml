name: ZEUS Next IPA download
on:
  push:
    branches: [feature/zeus-cloudflare-translation-20261021, feature/zeus-page-translation-20261021, fix/zeus-next-latest-build-20261020, fix/zeus-browser-stability-20261021]
    paths:
      - .github/workflows/zeus-ipa-download.yml
      - ZEUSNext/**
      - .zeus-ci/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Prepare lightweight native Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 .zeus-ci/project.py
          mkdir -p results
          xcodegen generate --spec zeus-project.json
      - name: Build real iOS device app
        run: |
          set -o pipefail
          xcodebuild -project ZEUSNext.xcodeproj -scheme ZEUSNext -configuration Release \
            -destination 'generic/platform=iOS' -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/ZEUSDevice" \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee results/device-build.log
      - name: Package and examine IPA contents
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/ZEUSDevice/Build/Products/Release-iphoneos/ZEUSNext.app"
          test -f "$app/Info.plist"
          test -s "$app/ZEUSNext"
          mkdir -p results/Payload
          cp -R "$app" results/Payload/
          (cd results && zip -qry ZEUS-2.3.0-unsigned.ipa Payload)
          test -s results/ZEUS-2.3.0-unsigned.ipa
          unzip -t results/ZEUS-2.3.0-unsigned.ipa > results/ipa-zip-test.txt
          unzip -Z1 results/ZEUS-2.3.0-unsigned.ipa | grep -Fqx 'Payload/ZEUSNext.app/Info.plist'
          unzip -Z1 results/ZEUS-2.3.0-unsigned.ipa | grep -Fqx 'Payload/ZEUSNext.app/ZEUSNext'
          xcrun lipo -info "$app/ZEUSNext"
          shasum -a 256 results/ZEUS-2.3.0-unsigned.ipa > results/ZEUS-2.3.0-unsigned.ipa.sha256
          ls -lh results/ZEUS-2.3.0-unsigned.ipa
          rm -rf results/Payload
      - name: Publish verified IPA file
        uses: actions/upload-artifact@v4
        with:
          name: zeus-next-ipa
          path: |
            results/ZEUS-2.3.0-unsigned.ipa
            results/ZEUS-2.3.0-unsigned.ipa.sha256
            results/ipa-zip-test.txt
          retention-days: 14
          if-no-files-found: error
      - name: Publish logs on build failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zeus-ipa-failure-logs
          path: results/device-build.log
          retention-days: 14
          if-no-files-found: ignore
