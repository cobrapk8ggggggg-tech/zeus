name: ZEUS temporary Android tunnel acceptance
on:
  push:
    branches: [feature/zeus-security-lab-20261030, "zeus-lab/**"]
    paths: [experiments/actions-lab/launch.json, .github/workflows/zeus-lab-tunnel.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zeus-android-interactive-acceptance
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build the repository's controlled keyboard and probe APK
        working-directory: AndroidLab/ime
        run: gradle --no-daemon :app:assembleDebug :probe:assembleDebug
      - name: Prepare bounded temporary transport
        run: |
          pip install -r AndroidLab/requirements.in
          sudo apt-get update -qq
          sudo apt-get install -y apksigner zipalign
          python AndroidLab/tests/prepare_tools.py
          echo '/tmp/zeus-android-tools' >> "$GITHUB_PATH"
          echo '/tmp/zeus-android-tools/jadx/bin' >> "$GITHUB_PATH"
          sudo useradd --uid 10002 --no-create-home zeus-apk
          sudo unshare --net true
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/zeus-lab-action" --no-save @actions/artifact@2.3.2 playwright@1.56.1
          mkdir -p "$RUNNER_TEMP/zeus-lab-proof"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real AVD with encrypted readiness and temporary HTTPS tunnel
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: AndroidLab
          LAB_ACTIONS_PROOF: ${{ runner.temp }}/zeus-lab-proof
          LAB_PROBE_APK: ${{ github.workspace }}/AndroidLab/ime/probe/build/outputs/apk/debug/probe-debug.apk
          ZEUS_ANDROID_IME_APK: ${{ github.workspace }}/AndroidLab/ime/app/build/outputs/apk/debug/app-debug.apk
          NODE_PATH: ${{ runner.temp }}/zeus-lab-action/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          ZEUS_ANDROID_BUILD_UID: '10002'
          ZEUS_ANDROID_TOOL_NETNS: '1'
        with:
          api-level: 32
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -writable-system
          script: node AndroidLab/actions/index.cjs
      - name: Preserve only encrypted session exports even after a failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeus-lab-encrypted-final
          retention-days: 1
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/zeus-lab-proof/*/*.sealed.json
            ${{ runner.temp }}/zeus-lab-proof/*/*.zlab
