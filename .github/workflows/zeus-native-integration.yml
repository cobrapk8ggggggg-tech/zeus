name: ZEUS native browser integration tests
'on':
  push:
    branches:
    - feature/openminis-native-20261023
    paths:
    - ZEUSNext/**
    - .openminis/**
    - .github/workflows/zeus-native-integration.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: Browser source branch, tag or commit to test
        default: feature/openminis-native-20261023
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: zeus-native-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integration:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        repository: cobrapk8ggggggg-tech/zeus
        ref: ${{ inputs.source_ref || (github.repository == 'cobrapk8ggggggg-tech/zeus' && github.sha) || 'feature/openminis-native-20261023' }}
        path: browser
        persist-credentials: false
    - name: Record the exact browser revision
      run: 'mkdir -p results

        git -C browser rev-parse HEAD > results/browser-commit.txt

        '
    - uses: actions/checkout@v4
      with:
        repository: naruto00o9n-max/OpenMinis
        ref: 6339bfcb25190ebf80fd03086c4ead81cf9428ba
        path: upstream
        submodules: recursive
        persist-credentials: false
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Prepare the original source for the simulator SDK
      run: "test \"$(uname -m)\" = arm64\npython3 browser/.openminis/prepare_reference.py upstream --sdk iphonesimulator --manifest results/original-source.json\nbrew install ninja llvm lld libarchive pkg-config\
        \ meson\necho \"$(brew --prefix llvm)/bin\" >> \"$GITHUB_PATH\"\necho \"$(brew --prefix lld)/bin\" >> \"$GITHUB_PATH\"\nif ! xcrun --sdk iphonesimulator metal --version; then\n  xcodebuild -downloadComponent\
        \ MetalToolchain\nfi\n"
    - uses: actions/cache/restore@v4
      id: native
      with:
        path: 'upstream/deps/libs

          upstream/deps/include

          upstream/deps/resources

          upstream/deps/frameworks

          upstream/deps/lame-build

          '
        key: openminis-6339bfcb-simulator-arm64-xcode263-v2
    - name: Build the actual native dependencies and Linux rootfs
      if: steps.native.outputs.cache-hit != 'true'
      working-directory: upstream
      run: 'set -euo pipefail

        bash deps/build_lame.sh 2>&1 | tee ../results/lame.log

        bash deps/build_ffmpeg.sh 2>&1 | tee ../results/ffmpeg.log

        bash deps/build_ish.sh 2>&1 | tee ../results/ish.log

        bash deps/prepare_alpine_rootfs.sh 2>&1 | tee ../results/rootfs.log

        '
    - uses: actions/cache/save@v4
      if: steps.native.outputs.cache-hit != 'true'
      with:
        path: 'upstream/deps/libs

          upstream/deps/include

          upstream/deps/resources

          upstream/deps/frameworks

          upstream/deps/lame-build

          '
        key: openminis-6339bfcb-simulator-arm64-xcode263-v2
    - name: Verify unchanged original application source
      run: python3 browser/.openminis/verify_source.py upstream results/original-source.json
    - name: Select available iPhone and iPad simulators
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json, os, subprocess\ndevices = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']\nall_devices\
        \ = [d for group in devices.values() for d in group]\nwith open(os.environ['GITHUB_ENV'], 'a') as output:\n    for kind in ['iPhone', 'iPad']:\n        match = next(d for d in all_devices if kind\
        \ in d['name'])\n        output.write(kind.upper() + '_SIMULATOR=' + match['udid'] + '\\n')\nPY\n"
    - name: Embed the original native application in the browser
      run: 'set -euo pipefail

        python3 browser/.openminis/embed_native.py upstream browser results/native-adapters.json

        gem install xcodeproj --version 1.27.0 --no-document

        ruby browser/.openminis/build_project.rb upstream browser

        '
    - name: Build the native browser and integration tests
      run: "set -euo pipefail\npython3 browser/.openminis/run_xcode.py results/embedded-build.log -- \\\n  xcodebuild -project upstream/src/ios/Minis.xcodeproj -scheme Minis \\\n  -configuration Debug -sdk\
        \ iphonesimulator -destination 'generic/platform=iOS Simulator' \\\n  -derivedDataPath \"$RUNNER_TEMP/OpenMinisOriginal\" \\\n  build-for-testing CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO\
        \ ARCHS=arm64\n"
    - name: Test the embedded original UI and real browser tools
      timeout-minutes: '12'
      id: embedded_tests
      run: "set -euo pipefail\ntests_failed=0\nfor kind in IPHONE IPAD; do\n  if [ \"$kind\" = IPHONE ]; then device=\"$IPHONE_SIMULATOR\"; else device=\"$IPAD_SIMULATOR\"; fi\n  xcrun simctl boot \"$device\"\
        \ || true\n  xcrun simctl bootstatus \"$device\" -b\n  # Both apps declare minis://. Remove the reference installation so\n  # settings deep links unambiguously open the embedded application.\n\
        \  xcrun simctl uninstall \"$device\" com.openminis.app || true\n  python3 browser/.openminis/capture_reference.py \"$device\" \\\n    \"$RUNNER_TEMP/OpenMinisOriginal/Build/Products/Debug-iphonesimulator/Minis.app\"\
        \ \\\n    \"results/embedded-screens-$kind\" --bundle tools.rea.ZEUSBrowserAnalysis || tests_failed=1\n  python3 browser/.openminis/run_xcode.py \"results/embedded-$kind-tests.log\" -- \\\n    xcodebuild\
        \ -project upstream/src/ios/Minis.xcodeproj -scheme Minis \\\n    -configuration Debug -destination \"platform=iOS Simulator,id=$device\" \\\n    -derivedDataPath \"$RUNNER_TEMP/OpenMinisOriginal\"\
        \ \\\n    -resultBundlePath \"results/embedded-$kind.xcresult\" \\\n    -only-testing:ZEUSBrowserIntegrationTests \\\n    -only-testing:MinisUITests/MessageListV3UITests/testLongContentMultiBundleRendering\
        \ \\\n    -only-testing:MinisUITests/MessageListV3UITests/testStreamingAutoScrollFollowsBottom \\\n    -parallel-testing-enabled NO -test-timeouts-enabled YES \\\n    -default-test-execution-time-allowance\
        \ 90 -maximum-test-execution-time-allowance 90 \\\n    test-without-building CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \\\n    || tests_failed=1\n  xcrun xcresulttool export attachments --path\
        \ \"results/embedded-$kind.xcresult\" \\\n    --output-path \"results/embedded-attachments-$kind\" || true\n  xcrun simctl shutdown \"$device\"\ndone\nexit \"$tests_failed\"\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: zeus-native-integration-reports
        path: results
        retention-days: '14'
        if-no-files-found: error
