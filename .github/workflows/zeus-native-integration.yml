name: ZEUS native browser integration tests
'on':
  push:
    branches:
    - build/zeus-unsigned-ipa-repair-20261023
    - fix/zeus-agent-tools-permissions-20261023
    paths:
    - ZEUSNext/**
    - .openminis/**
    - .github/workflows/zeus-native-integration.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: Browser source branch, tag or commit to test
        default: fix/zeus-agent-tools-permissions-20261023
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: zeus-native-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        repository: cobrapk8ggggggg-tech/zeus
        ref: ${{ inputs.source_ref || (github.repository == 'cobrapk8ggggggg-tech/zeus'
          && github.sha) || 'feature/openminis-native-20261023' }}
        path: browser
        persist-credentials: false
    - name: Record the exact browser revision
      run: |
        mkdir -p results
        git -C browser rev-parse HEAD > results/browser-commit.txt
    - uses: actions/checkout@v4
      with:
        repository: naruto00o9n-max/OpenMinis
        ref: 6339bfcb25190ebf80fd03086c4ead81cf9428ba
        path: upstream
        submodules: recursive
        persist-credentials: false
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Prepare the original source for the simulator SDK
      run: |
        test "$(uname -m)" = arm64
        python3 browser/.openminis/prepare_reference.py upstream --sdk iphonesimulator --manifest results/original-source.json
        brew install ninja llvm lld libarchive pkg-config meson
        echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
        echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
        if ! xcrun --sdk iphonesimulator metal --version; then
          xcodebuild -downloadComponent MetalToolchain
        fi
    - uses: actions/cache/restore@v4
      id: native
      with:
        path: |
          upstream/deps/libs
          upstream/deps/include
          upstream/deps/resources
          upstream/deps/frameworks
          upstream/deps/lame-build
        key: openminis-6339bfcb-simulator-arm64-xcode263-v2
    - name: Build the actual native dependencies and Linux rootfs
      if: steps.native.outputs.cache-hit != 'true'
      working-directory: upstream
      run: |
        set -euo pipefail
        bash deps/build_lame.sh 2>&1 | tee ../results/lame.log
        bash deps/build_ffmpeg.sh 2>&1 | tee ../results/ffmpeg.log
        bash deps/build_ish.sh 2>&1 | tee ../results/ish.log
        bash deps/prepare_alpine_rootfs.sh 2>&1 | tee ../results/rootfs.log
    - uses: actions/cache/save@v4
      if: steps.native.outputs.cache-hit != 'true'
      with:
        path: |
          upstream/deps/libs
          upstream/deps/include
          upstream/deps/resources
          upstream/deps/frameworks
          upstream/deps/lame-build
        key: openminis-6339bfcb-simulator-arm64-xcode263-v2
    - name: Verify unchanged original application source
      run: python3 browser/.openminis/verify_source.py upstream results/original-source.json
    - name: Embed the original native application in the browser
      run: |
        set -euo pipefail
        python3 browser/.openminis/embed_native.py upstream browser results/native-adapters.json
        gem install xcodeproj --version 1.27.0 --no-document
        ruby browser/.openminis/build_project.rb upstream browser
    - uses: actions/cache/restore@v4
      id: swift_cache
      with:
        path: |
          ${{ runner.temp }}/OpenMinisOriginal/Build
          ${{ runner.temp }}/OpenMinisOriginal/SourcePackages
          ${{ runner.temp }}/OpenMinisOriginal/ModuleCache.noindex
        key: zeus-native-deriveddata-263-v2-${{ github.run_id }}
        restore-keys: zeus-native-deriveddata-263-v2-
    - name: Select available iPhone and iPad simulators
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, subprocess
        devices = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
        types = json.loads(subprocess.check_output(['xcrun','simctl','list','devicetypes','-j']))['devicetypes']
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            for kind in ['iPhone', 'iPad']:
                runtime, match = next((runtime, device) for runtime, group in devices.items() for device in group if kind in device['name'])
                type_id = match.get('deviceTypeIdentifier') or next(t['identifier'] for t in types if t['name'] == match['name'])
                name = 'ZEUS-' + kind + '-' + os.environ['GITHUB_RUN_ID']
                identifier = subprocess.check_output(['xcrun','simctl','create',name,type_id,runtime], text=True).strip()
                output.write(kind.upper() + '_SIMULATOR=' + identifier + '\n')
        PY
      timeout-minutes: 4
    - name: Start simulator boot before Swift compilation
      timeout-minutes: 4
      run: xcrun simctl boot "$IPHONE_SIMULATOR" || true
      continue-on-error: true
    - name: Build the native browser and integration tests
      run: |
        set -euo pipefail
        python3 browser/.openminis/run_xcode.py results/embedded-build.log -- \
          xcodebuild -project upstream/src/ios/Minis.xcodeproj -scheme Minis \
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath "$RUNNER_TEMP/OpenMinisOriginal" \
          build-for-testing CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64
      id: native_build
    - uses: actions/cache/save@v4
      if: always() && steps.native_build.outcome != 'skipped' && steps.swift_cache.outputs.cache-hit
        != 'true'
      with:
        path: |
          ${{ runner.temp }}/OpenMinisOriginal/Build
          ${{ runner.temp }}/OpenMinisOriginal/SourcePackages
          ${{ runner.temp }}/OpenMinisOriginal/ModuleCache.noindex
        key: zeus-native-deriveddata-263-v2-${{ github.run_id }}
    - name: 'IPHONE: Boot'
      if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
      timeout-minutes: 10
      run: bash browser/.openminis/run_native_stage.sh boot IPHONE "${IPHONE_SIMULATOR}"
    - name: 'IPHONE: Run browser and tool integration tests'
      if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
      timeout-minutes: 8
      run: bash browser/.openminis/run_native_stage.sh tests IPHONE "${IPHONE_SIMULATOR}"
    - name: 'IPHONE: Save unit diagnostics immediately'
      if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: zeus-iphone-unit-diagnostics
        path: results/embedded-IPHONE*
        retention-days: 14
        if-no-files-found: warn
    - name: 'IPHONE: Capture original settings'
      if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
      timeout-minutes: 5
      run: bash browser/.openminis/run_native_stage.sh screens IPHONE "${IPHONE_SIMULATOR}"
    - name: 'IPHONE: Verify native chat and inline approval'
      if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
      timeout-minutes: 6
      run: bash browser/.openminis/run_native_stage.sh chat IPHONE "${IPHONE_SIMULATOR}"
    - name: 'IPHONE: Export diagnostics and shut down'
      if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
      timeout-minutes: 2
      run: bash browser/.openminis/run_native_stage.sh attachments IPHONE "${IPHONE_SIMULATOR}"
    - name: 'IPAD: Boot'
      if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
      timeout-minutes: 10
      run: bash browser/.openminis/run_native_stage.sh boot IPAD "${IPAD_SIMULATOR}"
    - name: 'IPAD: Run browser and tool integration tests'
      if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
      timeout-minutes: 8
      run: bash browser/.openminis/run_native_stage.sh tests IPAD "${IPAD_SIMULATOR}"
    - name: 'IPAD: Save unit diagnostics immediately'
      if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: zeus-ipad-unit-diagnostics
        path: results/embedded-IPAD*
        retention-days: 14
        if-no-files-found: warn
    - name: 'IPAD: Capture original settings'
      if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
      timeout-minutes: 5
      run: bash browser/.openminis/run_native_stage.sh screens IPAD "${IPAD_SIMULATOR}"
    - name: 'IPAD: Verify native chat and inline approval'
      if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
      timeout-minutes: 6
      run: bash browser/.openminis/run_native_stage.sh chat IPAD "${IPAD_SIMULATOR}"
    - name: 'IPAD: Export diagnostics and shut down'
      if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
      timeout-minutes: 2
      run: bash browser/.openminis/run_native_stage.sh attachments IPAD "${IPAD_SIMULATOR}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: zeus-native-integration-reports
        path: results
        retention-days: '14'
        if-no-files-found: error
