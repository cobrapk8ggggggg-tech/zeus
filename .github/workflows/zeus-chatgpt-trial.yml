name: ZEUS ChatGPT Android observation trial
on:
  push:
    branches: [feature/zeus-android-lab-20261030]
    paths: [experiments/chatgpt-trial/launch.json, .github/workflows/zeus-chatgpt-trial.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare the independent Android fixture and keyboard
        working-directory: AndroidLab/ime
        run: gradle --no-daemon :app:assembleDebug :probe:assembleDebug
      - name: Prepare the API32 guest and bounded observation tools
        run: |
          sdkmanager 'platforms;android-32' 'system-images;android-32;google_apis;x86_64'
          pip install -r AndroidLab/requirements.in
          python -m venv /tmp/zeus-chatgpt-capture
          /tmp/zeus-chatgpt-capture/bin/pip install mitmproxy==11.0.2
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/zeus-trial-action" --no-save @actions/artifact@2.3.2
          mkdir -p "$RUNNER_TEMP/chatgpt-proof"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Observe official ChatGPT with reviewed agent actions
        uses: ./experiments/chatgpt-trial/action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_PATH: ${{ runner.temp }}/zeus-trial-action/node_modules
          PYTHONPATH: AndroidLab:AndroidLab/tests:experiments/chatgpt-trial
          CHATGPT_PROOF_DIR: ${{ runner.temp }}/chatgpt-proof
          ZEUS_ANDROID_IME_APK: ${{ github.workspace }}/AndroidLab/ime/app/build/outputs/apk/debug/app-debug.apk
          LAB_PROBE_APK: ${{ github.workspace }}/AndroidLab/ime/probe/build/outputs/apk/debug/probe-debug.apk
          LAB_CAPTURE_EXE: /tmp/zeus-chatgpt-capture/bin/mitmdump
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatgpt-final-diagnostics
          path: ${{ runner.temp }}/chatgpt-proof/
          retention-days: 2
