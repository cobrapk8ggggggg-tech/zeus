name: Optional Safari filter pack (separate from the app)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Convert optional filter pack
        run: python3 .zeus-ci/filters.py
      - uses: actions/upload-artifact@v4
        with:
          name: optional-safari-rules-import-json
          path: |
            ZEUSNext/Resources/safari-rules.json
            ZEUSNext/Resources/FILTER-NOTICES.txt
            results/filter-metadata.json
          if-no-files-found: error
          retention-days: 14
